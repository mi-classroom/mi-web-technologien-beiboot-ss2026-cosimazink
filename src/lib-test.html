<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Gesture Library – Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    h1   { font-size: 1rem; color: #888; margin-bottom: 1rem; }

    #camera-wrapper { position: relative; width: 640px; height: 480px; }
    video, canvas   { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }

    #log {
      margin-top: 1rem;
      width: 640px;
      height: 220px;
      overflow-y: auto;
      background: #1a1a1a;
      padding: 0.75rem;
      border: 1px solid #333;
      font-size: 0.8rem;
      line-height: 1.7;
    }
    .action  { color: #f90; }
    .state   { color: #888; }
    .system  { color: #4af; }
  </style>
</head>
<body>

  <h1>Gesture Library — live test</h1>

  <div id="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="log"></div>

  <script type="module">
    import {
      GestureRecognizer,
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    import {
      GestureLibrary,
      PinchSwipeGesture,
      ShoulderTapGesture,
      HandsToHeadGesture,
      HandsToHipsGesture,
    } from "./lib/index.js";

    // ── DOM ──────────────────────────────────────────────────────────────────
    const video  = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx    = canvas.getContext("2d");
    const logEl  = document.getElementById("log");

    function log(text, cls = "system") {
      const line = document.createElement("div");
      line.className = cls;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      logEl.prepend(line);
    }

    // ── Library setup ────────────────────────────────────────────────────────
    const lib = new GestureLibrary();

    lib
      .register(new PinchSwipeGesture())
      .register(new ShoulderTapGesture())
      .register(new HandsToHeadGesture())
      .register(new HandsToHipsGesture());

    // Log every action that fires
    lib.on("pinch-swipe",   ({ action, state }) => {
      if (action) log(`pinch-swipe  → action: ${action}`, "action");
      else        log(`pinch-swipe  → state: ${state}`,   "state");
    });
    lib.on("shoulder-tap",  ({ action, state }) => {
      if (action) log(`shoulder-tap → action: ${action}`, "action");
      else        log(`shoulder-tap → state: ${state}`,   "state");
    });
    lib.on("hands-to-head", ({ action, state }) => {
      if (action) log(`hands-to-head → action: ${action}`, "action");
      else        log(`hands-to-head → state: ${state}`,   "state");
    });
    lib.on("hands-to-hips", ({ action, state }) => {
      if (action) log(`hands-to-hips → action: ${action}`, "action");
      else        log(`hands-to-hips → state: ${state}`,   "state");
    });

    // ── MediaPipe setup ──────────────────────────────────────────────────────
    log("Lade Modelle…");

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    const [handRecognizer, poseRecognizer] = await Promise.all([
      GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: 2,
      }),
      PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numPoses: 1,
      }),
    ]);

    log("Modelle geladen. Kamera startet…");

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" },
    });
    video.srcObject = stream;
    video.addEventListener("loadeddata", () => {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      log("Kamera aktiv. Gesten werden erkannt.");
      requestAnimationFrame(loop);
    });

    // ── Frame loop ───────────────────────────────────────────────────────────
    let lastVideoTime = -1;
    const drawing = new DrawingUtils(ctx);

    function loop() {
      if (video.readyState < 2 || video.currentTime === lastVideoTime) {
        requestAnimationFrame(loop); return;
      }
      lastVideoTime = video.currentTime;

      const ts           = performance.now();
      const handResults  = handRecognizer.recognizeForVideo(video, ts);
      let   poseResults  = null;
      try { poseResults = poseRecognizer.detectForVideo(video, ts); } catch (_) {}

      // Draw landmarks
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < handResults.landmarks.length; i++) {
        drawing.drawConnectors(handResults.landmarks[i], GestureRecognizer.HAND_CONNECTIONS, { color: "#00c8ff", lineWidth: 2 });
        drawing.drawLandmarks(handResults.landmarks[i],  { color: "#fff", fillColor: "#00c8ff", radius: 3 });
      }
      if (poseResults?.landmarks?.length) {
        drawing.drawConnectors(poseResults.landmarks[0], PoseLandmarker.POSE_CONNECTIONS, { color: "rgba(255,255,255,0.2)", lineWidth: 1 });
      }

      // ── This is all the Library needs ────────────────────────────────────
      lib.detect({ handResults, poseResults }, ts);

      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
