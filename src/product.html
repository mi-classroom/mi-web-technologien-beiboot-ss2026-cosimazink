    <title>Produkt — GestureShop</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #111;
      }

      header {
        background: #fff;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        height: 52px;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .logo {
        font-size: 1rem;
        font-weight: 700;
        color: #f90;
        text-decoration: none;
      }
      .back-link {
        font-size: 0.75rem;
        font-family: monospace;
        color: #888;
        text-decoration: none;
      }
      .back-link:hover {
        color: #f90;
      }

      /* Product detail */
      .product-detail {
        max-width: 860px;
        margin: 2rem auto;
        padding: 0 2rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.5rem;
        align-items: start;
      }

      .product-image {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 6rem;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
      }

      .product-meta h1 {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
      }
      .product-price-large {
        font-size: 1.8rem;
        font-weight: 800;
        color: #f90;
        font-family: monospace;
        margin-bottom: 1rem;
      }
      .product-short {
        font-size: 0.82rem;
        color: #666;
        line-height: 1.7;
        margin-bottom: 1.2rem;
      }

      .add-btn {
        width: 100%;
        padding: 0.8rem;
        background: #f90;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 700;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .add-btn:hover {
        background: #e08500;
      }

      .specs {
        margin-top: 1.2rem;
      }
      .spec-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.78rem;
        padding: 0.4rem 0;
        border-bottom: 1px solid #eee;
        color: #666;
      }
      .spec-row span:last-child {
        color: #111;
      }

      /* Sections */
      .section {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 2rem 2rem;
      }
      .section h2 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #aaa;
        margin-bottom: 0.8rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e5e5e5;
      }
      .section p {
        font-size: 0.82rem;
        color: #555;
        line-height: 1.8;
        margin-bottom: 0.8rem;
      }

      /* Reviews */
      .review {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 4px;
        padding: 0.9rem 1rem;
        margin-bottom: 0.6rem;
      }
      .review-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.3rem;
        font-size: 0.75rem;
      }
      .review-author {
        font-weight: 600;
      }
      .review-stars {
        color: #f90;
      }
      .review p {
        font-size: 0.78rem;
        color: #666;
        line-height: 1.6;
      }

      /* Related */
      .related-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.8rem;
      }
      .related-card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 4px;
        padding: 0.8rem;
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        transition: box-shadow 0.15s;
      }
      .related-card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      }
      .related-thumb {
        font-size: 1.6rem;
      }
      .related-name {
        font-size: 0.78rem;
        font-weight: 600;
      }
      .related-price {
        font-size: 0.73rem;
        color: #f90;
        font-family: monospace;
      }

      footer {
        text-align: center;
        padding: 2rem;
        font-size: 0.7rem;
        color: #bbb;
        font-family: monospace;
        border-top: 1px solid #e5e5e5;
        margin-top: 1rem;
      }

      /* Gesture overlay */
      #gs-overlay {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.3rem;
        pointer-events: none;
      }
      #gs-camera {
        position: relative;
        width: 160px;
        height: 120px;
        border: 1px solid #e5e5e5;
        border-radius: 4px;
        overflow: hidden;
        background: #000;
      }
      #gs-video,
      #gs-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
      }
      #gs-status {
        font-family: monospace;
        font-size: 0.6rem;
        color: #bbb;
      }
      #gs-feedback {
        font-family: monospace;
        font-size: 1.4rem;
        color: #f90;
        min-height: 1.8rem;
        text-align: right;
      }

      #gs-cursor {
        position: fixed;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 60, 60, 0.8);
        box-shadow: 0 0 6px 2px rgba(255, 60, 60, 0.3);
        pointer-events: none;
        display: none;
        transform: translate(-50%, -50%);
        z-index: 200;
      }
      #gs-cursor.clicking {
        transform: translate(-50%, -50%) scale(1.5);
        background: #f90;
      }
    </style>
  </head>
