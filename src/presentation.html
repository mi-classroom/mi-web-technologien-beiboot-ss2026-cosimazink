<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue 02: Gesture Control Presentation</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css" />
  <link rel="stylesheet" href="styles/combined.css" />


</head>
<body>

  <div class="reveal">
    <div class="slides">

      <section>
        <section> 
          <div class="slide">
            <span class="arrow-up"></span>
            <span class="arrow-left"></span>
            <span class="slide-num">1</span>
            <span class="arrow-right">→</span>
            <span class="arrow-down">↓</span>
          </div>
        </section>
        <section> 
          <div class="slide">
            <span class="arrow-up">↑</span>
            <span class="arrow-left"></span>
            <span class="slide-num">4</span>
            <span class="arrow-right">→</span>
            <span class="arrow-down"></span>
          </div>
        </section>
      </section>

      <section>
        <section> 
          <div class="slide">
            <span class="arrow-up"></span>
            <span class="arrow-left">←</span>
            <span class="slide-num">2</span>
            <span class="arrow-right">→</span>
            <span class="arrow-down">↓</span>
          </div>
        </section>
        <section> 
          <div class="slide">
            <span class="arrow-up">↑</span>
            <span class="arrow-left">←</span>
            <span class="slide-num">5</span>
            <span class="arrow-right">→</span>
            <span class="arrow-down"></span>
          </div>
        </section>
      </section>

      <section>
        <section> 
          <div class="slide">
            <span class="arrow-up"></span>
            <span class="arrow-left">←</span>
            <span class="slide-num">3</span>
            <span class="arrow-right"></span>
            <span class="arrow-down">↓</span>
          </div>
        </section>
        <section> 
          <div class="slide">
            <span class="arrow-up">↑</span>
            <span class="arrow-left">←</span>
            <span class="slide-num">6</span>
            <span class="arrow-right"></span>
            <span class="arrow-down"></span>
          </div>
        </section>
      </section>

    </div>
  </div>

  <div id="gc-overlay">
    <div id="gc-camera">
      <video id="gc-video" autoplay playsinline muted></video>
      <canvas id="gc-canvas"></canvas>
    </div>
    <div id="gc-status">Initialisiere…</div>
    <div id="gc-feedback"></div>
  </div>

  // Reveal.js
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script>
    window.Reveal = Reveal;
    Reveal.initialize({ hash: true, transition: "slide", controls: false, progress: false });
  </script>

  <script type="module" src="scripts/gesture-control.js"></script>
</body>
</html>
